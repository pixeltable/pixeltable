[project]
name = "lead-enrichment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pixeltable[serve]>=0.7.16",
    "httpx>=0.27",
    "openai>=1.40",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "udfs"]
