" font-size="11" font-weight="400" fill="#595959" text-anchor="start" >08</text><text x="46" y="381" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#070000" text-anchor="start" >Remember across sessions</text><line x1="13" y1="406" x2="359" y2="406" stroke="#e0e0e0" stroke-opacity="0.5"/><text x="24" y="423" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#595959" text-anchor="start" >09</text><text x="46" y="423" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#070000" text-anchor="start" >Trace a running app</text><line x1="13" y1="448" x2="359" y2="448" stroke="#e0e0e0" stroke-opacity="0.5"/><text x="24" y="465" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#595959" text-anchor="start" >10</text><text x="46" y="465" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#070000" text-anchor="start" >Evaluate model output</text><line x1="13" y1="490" x2="359" y2="490" stroke="#e0e0e0" stroke-opacity="0.5"/><text x="24" y="507" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#595959" text-anchor="start" >11</text><text x="46" y="507" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#070000" text-anchor="start" >Rerun what failed</text><line x1="13" y1="532" x2="359" y2="532" stroke="#e0e0e0" stroke-opacity="0.5"/><text x="24" y="549" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#59595