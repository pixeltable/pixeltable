<g><text x="46" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >bucket · sync script · metadata DB</text><text x="46" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >queue · preprocessing job</text><text x="46" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >queue · workers · status table</text><text x="46" y="231" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >download script · notebook · local copies</text><text x="46" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >embed job · vector DB</text><text x="46" y="315" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >API service · metadata DB · vector DB</text><text x="46" y="357" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >agent framework · tool logs</text><text x="46" y="399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >chat cache · vector store</text><text x="46" y="441" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >tracing SDK · log store</text><text x="46" y="483" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >log export · eval notebook</text><text x="46" y="525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >dead-letter queue · retry script</text><text x="46" y="567" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >ETL job · second database · bucket sync</text><text x="46" y="609" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#595959" text-anchor="start" >ETL job · warehouse</text></g>
<g class="pixeltable"><rect x="13" y="92" width="346" height="18" fill="#ffffff"/><text x="46" y="105" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">video: pxt.</tspan><tspan fill="#267f99">Video</tspan></text><rect x="13" y="134" width="346" height="18" fill="#ffffff"/><text x="46" y="147" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">iterator=</tspan><tspan fill="#795e26">frame_iterator</tspan><tspan fill="#070000">(video, fps=</tspan><tspan fill="#098658">1</tspan><tspan fill="#070000">)</tspan></text><rect x="13" y="176" width="346" height="18" fill="#ffffff"/><text x="46" y="189" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">transcript = openai.</tspan><tspan fill="#795e26">transcriptions</tspan><tspan fill="#070000">(audio, …)</tspan></text><rect x="13" y="218" width="346" height="18" fill="#ffffff"/><text x="46" y="231" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">frames.</tspan><tspan fill="#795e26">select</tspan><tspan fill="#070000">(frames.frame, frames.detections)</tspan></text><rect x="13" y="260" width="346" height="18" fill="#ffffff"/><text x="46" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">pxt.</tspan><tspan fill="#795e26">EmbeddingIndex</tspan><tspan fill="#070000">(summary, embedding=embed)</tspan></text><rect x="13" y="302" width="346" height="18" fill="#ffffff"/><text x="46" y="315" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">api.</tspan><tspan fill="#795e26">add_query_route</tspan><tspan fill="#070000">(path=</tspan><tspan fill="#a31515">'/search'</tspan><tspan fill="#070000">, …)</tspan></text><rect x="13" y="344" width="346" height="18" fill="#ffffff"/><text x="46" y="357" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">tool_output = </tspan><tspan fill="#795e26">invoke_tools</tspan><tspan fill="#070000">(tools, response)</tspan></text><rect x="13" y="386" width="346" height="18" fill="#ffffff"/><text x="46" y="399" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">memories = </tspan><tspan fill="#795e26">recall_memories</tspan><tspan fill="#070000">(user_id, message)</tspan></text><rect x="13" y="428" width="346" height="18" fill="#ffffff"/><text x="46" y="441" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">pxt service update app.py my_app --otel</tspan></text><rect x="13" y="470" width="346" height="18" fill="#ffffff"/><text x="46" y="483" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">assistant.</tspan><tspan fill="#795e26">select</tspan><tspan fill="#070000">(assistant.response.usage)</tspan></text><rect x="13" y="512" width="346" height="18" fill="#ffffff"/><text x="46" y="525" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">pxt errors my_app/docs</tspan></text><rect x="13" y="554" width="346" height="18" fill="#ffffff"/><text x="46" y="567" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">pxt.io.</tspan><tspan fill="#795e26">export_sql</tspan><tspan fill="#070000">(q, </tspan><tspan fill="#a31515">'dets'</tspan><tspan fill="#070000">, db_connect_str=…)</tspan></text><rect x="13" y="596" width="346" height="18" fill="#ffffff"/><text x="46" y="609" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#070000">videos.</tspan><tspan fill="#795e26">history</tspan><tspan fill="#070000">()</tspan></text></g>
