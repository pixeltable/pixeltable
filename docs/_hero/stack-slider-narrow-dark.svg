<rect x="12.5" y="40.5" width="347" height="575" rx="10" fill="#0e110e" stroke="#383838"/><path d="M12.5 70 V50.5 a10 10 0 0 1 10 -10 H349.5 a10 10 0 0 1 10 10 V70 Z" fill="#171b17"/><line x1="13" y1="70" x2="359" y2="70" stroke="#383838"/><text x="24" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f2f2f2" text-anchor="start" >What a request needs</text><text x="24" y="87" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#a6a6a6" text-anchor="start" >01</text><text x="46" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="start" >Store files and their results</text><line x1="13" y1="112" x2="359" y2="112" stroke="#383838" stroke-opacity="0.5"/><text x="24" y="129" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#a6a6a6" text-anchor="start" >02</text><text x="46" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="start" >Split documents or sample frames</text><line x1="13" y1="154" x2="359" y2="154" stroke="#383838" stroke-opacity="0.5"/><text x="24" y="171" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#a6a6a6" text-anchor="start" >03</text><text x="46" y="171" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="start" >Call models</text><line x1="13" y1="196" x2="359" y2="196" stroke="#383838" stroke-opacity="0.5"/><text x="24" y="213" font-family="ui-monospace,SFMono-Regular,'SF Mono',M