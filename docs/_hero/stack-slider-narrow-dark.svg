" font-size="11" font-weight="400" fill="#a6a6a6" text-anchor="start" >08</text><text x="46" y="381" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="start" >Remember across sessions</text><line x1="13" y1="406" x2="359" y2="406" stroke="#383838" stroke-opacity="0.5"/><text x="24" y="423" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#a6a6a6" text-anchor="start" >09</text><text x="46" y="423" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="start" >Trace a running app</text><line x1="13" y1="448" x2="359" y2="448" stroke="#383838" stroke-opacity="0.5"/><text x="24" y="465" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#a6a6a6" text-anchor="start" >10</text><text x="46" y="465" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="start" >Evaluate model output</text><line x1="13" y1="490" x2="359" y2="490" stroke="#383838" stroke-opacity="0.5"/><text x="24" y="507" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#a6a6a6" text-anchor="start" >11</text><text x="46" y="507" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="start" >Rerun what failed</text><line x1="13" y1="532" x2="359" y2="532" stroke="#383838" stroke-opacity="0.5"/><text x="24" y="549" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#a6a6a6" text-anchor="start" >12</text><text x="46" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="start" >Send results elsewhere</text><line x1="13" y1="574" x2="359" y2="574" stroke="#383838" stroke-opacity="0.5"/><text x="24" y="591" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#a6a6a6" text-anchor="start" >13</text><text x="46" y="591" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="start" >Analyze and audit</text>
<g><text x="46" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >bucket · sync script · metadata DB</text><text x="46" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >queue · preprocessing job</text><text x="46" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >queue · workers · status table</text><text x="46" y="231" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >download script · notebook · local copies</text><text x="46" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >embed job · vector DB</text><text x="46" y="315" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >API service · metadata DB · vector DB</text><text x="46" y="357" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >agent framework · tool logs</text><text x="46" y="399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >chat cache · vector store</text><text x="46" y="441" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >tracing SDK · log store</text><text x="46" y="483" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >log export · eval notebook</text><text x="46" y="525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >dead-letter queue · retry script</text><text x="46" y="567" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >ETL job · second database · bucket sync</text><text x="46" y="609" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a6a6a6" text-anchor="start" >ETL job · warehouse</text></g>
<g class="pixeltable"><rect x="13" y="92" width="346" height="18" fill="#0e110e"/><text x="46" y="105" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">video: pxt.</tspan><tspan fill="#4ec9b0">Video</tspan></text><rect x="13" y="134" width="346" height="18" fill="#0e110e"/><text x="46" y="147" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">iterator=</tspan><tspan fill="#dcdcaa">frame_iterator</tspan><tspan fill="#f2f2f2">(video, fps=</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#f2f2f2">)</tspan></text><rect x="13" y="176" width="346" height="18" fill="#0e110e"/><text x="46" y="189" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">transcript = openai.</tspan><tspan fill="#dcdcaa">transcriptions</tspan><tspan fill="#f2f2f2">(audio, …)</tspan></text><rect x="13" y="218" width="346" height="18" fill="#0e110e"/><text x="46" y="231" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">frames.</tspan><tspan fill="#dcdcaa">select</tspan><tspan fill="#f2f2f2">(frames.frame, frames.detections)</tspan></text><rect x="13" y="260" width="346" height="18" fill="#0e110e"/><text x="46" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">pxt.</tspan><tspan fill="#dcdcaa">EmbeddingIndex</tspan><tspan fill="#f2f2f2">(summary, embedding=embed)</tspan></text><rect x="13" y="302" width="346" height="18" fill="#0e110e"/><text x="46" y="315" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">api.</tspan><tspan fill="#dcdcaa">add_query_route</tspan><tspan fill="#f2f2f2">(path=</tspan><tspan fill="#ce9178">'/search'</tspan><tspan fill="#f2f2f2">, …)</tspan></text><rect x="13" y="344" width="346" height="18" fill="#0e110e"/><text x="46" y="357" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">tool_output = </tspan><tspan fill="#dcdcaa">invoke_tools</tspan><tspan fill="#f2f2f2">(tools, response)</tspan></text><rect x="13" y="386" width="346" height="18" fill="#0e110e"/><text x="46" y="399" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">memories = </tspan><tspan fill="#dcdcaa">recall_memories</tspan><tspan fill="#f2f2f2">(user_id, message)</tspan></text><rect x="13" y="428" width="346" height="18" fill="#0e110e"/><text x="46" y="441" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">pxt service update app.py my_app --otel</tspan></text><rect x="13" y="470" width="346" height="18" fill="#0e110e"/><text x="46" y="483" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">assistant.</tspan><tspan fill="#dcdcaa">select</tspan><tspan fill="#f2f2f2">(assistant.response.usage)</tspan></text><rect x="13" y="512" width="346" height="18" fill="#0e110e"/><text x="46" y="525" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">pxt errors my_app/docs</tspan></text><rect x="13" y="554" width="346" height="18" fill="#0e110e"/><text x="46" y="567" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">pxt.io.</tspan><tspan fill="#dcdcaa">export_sql</tspan><tspan fill="#f2f2f2">(q, </tspan><tspan fill="#ce9178">'dets'</tspan><tspan fill="#f2f2f2">, db_connect_str=…)</tspan></text><rect x="13" y="596" width="346" height="18" fill="#0e110e"/><text x="46" y="609" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" xml:space="preserve"><tspan fill="#f2f2f2">videos.</tspan><tspan fill="#dcdcaa">history</tspan><tspan fill="#f2f2f2">()</tspan></text></g>
