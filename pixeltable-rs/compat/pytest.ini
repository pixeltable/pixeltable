# pytest configuration for the pixeltable-rs compatibility harness. Mirrors upstream pyproject.toml's
# [tool.pytest.ini_options] (markers, default -m filter, filterwarnings); the filters that name Pixeltable warning
# classes are added by tests/conftest.py. Having this file in compat/ keeps pytest from picking up the upstream
# pyproject.toml.
[pytest]
testpaths = tests
addopts = -v -m "not remote_api and not expensive and not very_expensive and not benchmark and not otel" --strict-markers --import-mode=prepend
markers =
    expensive: marks tests as expensive to run
    very_expensive: marks tests as very expensive to run, or as depending on an unreliable external service
    remote_api: marks tests as calling a remote API (such as OpenAI)
    benchmark: marks tests as benchmark tests (excluded from regular test runs)
    db_roots: test runs only against specified database roots, e.g. @pytest.mark.db_roots('local', reason='...')
    otel: marks tests as requiring the otel extra (run on the otel CI leg)
    flaky: rerun marker of pytest-rerunfailures (used by tests.utils.rerun); inert unless that plugin is installed
filterwarnings =
    ignore:The `dict` method is deprecated; use `model_dump` instead.:DeprecationWarning
    ignore:Pydantic V1 style `@validator` validators are deprecated.:DeprecationWarning
    ignore:Pydantic V1 style `@root_validator` validators are deprecated.:DeprecationWarning
    ignore:`allow_reuse` is deprecated and will be ignored:DeprecationWarning
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
    ignore:FP16 is not supported on CPU:UserWarning
    ignore:Deprecated call to `pkg_resources:DeprecationWarning
    ignore:The get_cmap function was deprecated in Matplotlib 3.7:DeprecationWarning
    ignore:pkg_resources is deprecated as an API:
    ignore:torchaudio._backend.set_audio_backend:UserWarning
    ignore:The 'strip_cdata' option of HTMLParser:DeprecationWarning
    ignore:No uuidRepresentation is specified! Falling back to 'pythonLegacy' which is the default for pymongo 3.x:DeprecationWarning
    ignore:`resume_download` is deprecated and will be removed:FutureWarning
    ignore:.*builtin type .* has no __module__ attribute.*:DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
# per-test timeout (pytest-timeout); run.py switches to the thread method under xdist, which also stops a test stuck in
# native code that never returns to the interpreter
timeout = 120
