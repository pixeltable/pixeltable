name: pixeltable-devcontainer

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/pixeltable:cached
    command: sleep infinity
    # No database service: Pixeltable starts its embedded Postgres when PIXELTABLE_DB_CONNECT_STR is unset.
    environment:
      TZ: UTC
      CMAKE_ARGS: -DLLAVA_BUILD=OFF
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      HF_DEACTIVATE_ASYNC_LOAD: "1"
