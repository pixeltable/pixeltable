# `pxt db update pxt://pixeltable:tsdemo` deploys this example, and `pxt schema update app.ts pxt://pixeltable:tsdemo`
# then creates its tables. `demo.ts` reads and writes them from TypeScript.
[[pixeltable.database]]
name = "pxt://pixeltable:tsdemo"
# a pod runs no TypeScript; without this, editing the example would drift the archive and call for a redeploy
exclude = ["*.ts", "*.tsx"]
