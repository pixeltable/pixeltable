name: Risk assessment

# On every push to a non-draft PR, Claude compares the change with the critical components register
# (docs/design/critical-components.md) and decides whether 1 or 2 humans must be involved. The verdict goes into one PR
# comment that each run updates. The check is advisory: the job always passes and blocks nothing.
#
# Security model:
# - pull_request_target runs this file, .claude/commands/pxt-risk.md, the register, and every script from the base
#   branch, so a PR cannot change its own assessment. It also gives fork PRs the API key. Nothing from the PR runs.
# - The working directory holds the PR head, because pyright must analyze the code after the change. Every agent
#   instruction file and every symlink in it is removed, and the base branch's instructions and register are copied
#   in. The base branch itself is in $RUNNER_TEMP/base, which also holds the scripts and pyright that run.
# - Claude gets only GITHUB_TOKEN and read-only tools: Read, Grep, Glob, `gh pr view`, `gh pr diff`, and the pyright
#   navigation tools of .github/scripts/pyright_mcp.py, which analyze code statically. It cannot post: the post step
#   publishes its final message.
# - Any PR author and any bot can trigger the run (allowed_non_write_users and allowed_bots are '*'). PR content can
#   at most mislead the verdict or the comment text, which a human reads.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the PR to assess
        required: true

jobs:
  assess:
    name: 'risk #${{ github.event.pull_request.number || inputs.pr }}'
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # A new push replaces an assessment that is still running.
    concurrency:
      group: risk-assessment-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      REGISTER: docs/design/critical-components.md
      # Removes ANTHROPIC_API_KEY and other secrets from the environment of the processes Claude starts.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "BASE=$RUNNER_TEMP/base" >> "$GITHUB_ENV"
          gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '"head=" + .headRefOid' >> "$GITHUB_OUTPUT"
      # actions/checkout refuses fork PR code in a pull_request_target run without allow-unsafe-pr-checkout. Nothing
      # from this copy runs; the next steps strip its agent files.
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 1
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: actions/checkout@v6
        with:
          path: base-checkout
          fetch-depth: 1
          persist-credentials: false
      - run: mv base-checkout "$BASE"
      # Claude loads CLAUDE.md, AGENTS.md, .claude/ and .mcp.json from its working directory, and Read follows symlinks.
      # Remove the PR's copies and every symlink, then copy in the base branch's instructions, the register, and the
      # pyright config, so that the PR can neither instruct Claude nor change what pyright analyzes.
      - run: |
          find . -path ./.git -prune -o -type l -print -exec rm -f {} +
          find . -path ./.git -prune -o \
            \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md -o -name .claude -o -name .mcp.json \
               -o -name pyrightconfig.json \) -prune -exec rm -rf {} +
          rm -rf .github/instructions
          mkdir -p .claude/commands "$(dirname "$REGISTER")"
          cp "$BASE/CLAUDE.md" "$BASE/AGENTS.md" .
          cp -r "$BASE/.github/instructions" .github/
          cp "$BASE/.claude/commands/pxt-risk.md" .claude/commands/
          cp "$BASE/$REGISTER" "$REGISTER"
          cp "$BASE/.github/risk-assessment/pyrightconfig.json" .
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Pinned by hash in package-lock.json; --ignore-scripts runs no install scripts.
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$BASE/.github/risk-assessment"
      - run: |
          cat > "$RUNNER_TEMP/mcp.json" <<EOF
          {"mcpServers": {"pyright": {"command": "python3", "args": [
            "$BASE/.github/scripts/pyright_mcp.py", "--root", "$GITHUB_WORKSPACE",
            "--langserver", "$BASE/.github/risk-assessment/node_modules/.bin/pyright-langserver --stdio"]}}}
          EOF
      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB fails without bubblewrap. Ubuntu 24.04 blocks the unprivileged user namespaces
      # bubblewrap needs.
      - continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: '*'
          allowed_bots: '*'
          settings: '{"permissions": {"additionalDirectories": ["${{ env.BASE }}"]}}'
          prompt: >-
            /pxt-risk https://github.com/${{ github.repository }}/pull/${{ env.PR_NUMBER }}
            --base ${{ env.BASE }} --register ${{ env.REGISTER }}
          # Naming a bot in allowed_bots turns off the action's default auto permission mode, so it is set here.
          claude_args: >-
            --model claude-opus-5-5 --permission-mode auto --max-turns 80
            --mcp-config ${{ runner.temp }}/mcp.json
            --allowedTools "Read" "Grep" "Glob" "Bash(gh pr view:*)" "Bash(gh pr diff:*)"
            "mcp__pyright__find_references" "mcp__pyright__incoming_calls" "mcp__pyright__find_definition"
            "mcp__pyright__hover" "mcp__pyright__document_symbols" "mcp__pyright__workspace_symbols"
      # The action hides Claude's transcript. Print Claude's final message, each tool call the allowlist refused, the
      # number of pyright calls, and the cost per model.
      - if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ "$OUTCOME" != success ]; then echo "::warning::The Claude step ended with outcome $OUTCOME."; fi
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then exit 0; fi
          jq -r '.[] | select(.type == "result") | .result // empty' "$EXECUTION_FILE"
          jq -c '.[] | select(.type == "result") | .permission_denials[]? | {tool_name, tool_input}' "$EXECUTION_FILE"
          jq -r '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .name]
            | group_by(.) | map("\(.[0]): \(length)") | join(", ") | "Tool calls: " + .' "$EXECUTION_FILE"
          jq -r '.[] | select(.type == "result") | (.modelUsage // {}) | to_entries[] | [.key,
            "$\((.value.costUSD * 100 | round) / 100)", "input \(.value.inputTokens)", "output \(.value.outputTokens)",
            "cache read \(.value.cacheReadInputTokens)", "cache write \(.value.cacheCreationInputTokens)"]
            | join(", ")' "$EXECUTION_FILE"
      # Runs from the base branch: the working directory holds PR code. The job passes even when this fails.
      - if: always() && !cancelled()
        continue-on-error: true
        working-directory: ${{ env.BASE }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 .github/scripts/post_risk_assessment.py
