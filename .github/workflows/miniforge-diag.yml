name: miniforge-diag
on: push
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        miniforge-version: [latest, 26.7.2-1]
    runs-on: windows-2025
    steps:
      - name: Install miniforge
        id: install
        continue-on-error: true
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: ${{ matrix.miniforge-version }}
          activate-environment: pxt
          conda-remove-defaults: true
      - name: conda info
        shell: cmd
        run: call C:\Users\runneradmin\miniconda3\condabin\conda.bat info
      - name: conda list
        shell: cmd
        run: call C:\Users\runneradmin\miniconda3\condabin\conda.bat list -n base --show-channel-urls
      - name: conda-launchers record
        shell: cmd
        run: type C:\Users\runneradmin\miniconda3\conda-meta\conda-launchers-*.json
      - name: conda init -vv
        shell: cmd
        run: call C:\Users\runneradmin\miniconda3\condabin\conda.bat init --all -vv
      - name: Reinstall conda-launchers with safety checks, then conda init
        if: ${{ matrix.miniforge-version == 'latest' }}
        shell: cmd
        run: |
          set CONDA_SAFETY_CHECKS=warn
          call C:\Users\runneradmin\miniconda3\condabin\conda.bat install -n base --force-reinstall -y conda-launchers
          type C:\Users\runneradmin\miniconda3\conda-meta\conda-launchers-*.json
          call C:\Users\runneradmin\miniconda3\condabin\conda.bat init --all
