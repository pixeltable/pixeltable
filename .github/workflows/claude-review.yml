name: Claude review

# pull_request_target runs this file from the base branch with the base repository's secrets, so PRs from forks get
# reviewed too. Nothing from the PR runs: the PR head is checked out to pr-head/ only for Claude to read.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # claude-code-action fails the job when the actor lacks write access. Skip the review for those actors instead.
  access:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      write: ${{ steps.check.outputs.write }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission || echo none)
          case "$permission" in
            admin|write) echo write=true >> "$GITHUB_OUTPUT" ;;
            *) echo write=false >> "$GITHUB_OUTPUT" ;;
          esac

  review:
    needs: access
    if: needs.access.outputs.write == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: '/review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: >-
            --model claude-opus-5-5
            --add-dir pr-head
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
