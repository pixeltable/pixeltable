name: Claude review

# Reviews a PR when it opens, if its author has write access, and when someone with write access comments exactly
# "claude review" on it. Both events run this file from the base branch with the base repository's secrets, so fork PRs
# get reviewed too. Nothing from the PR runs.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

jobs:
  # Checks the PR author for automatic reviews and the commenter for requested ones, so a maintainer marking an
  # outside PR ready does not review it automatically. claude-code-action also fails when the actor lacks write access.
  access:
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event.issue.pull_request && github.event.comment.body == 'claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      write: ${{ steps.check.outputs.write }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          USER_LOGIN: ${{ github.event.pull_request.user.login || github.actor }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$USER_LOGIN/permission" --jq .permission || echo none)
          case "$permission" in
            admin|write) echo write=true >> "$GITHUB_OUTPUT" ;;
            *) echo write=false >> "$GITHUB_OUTPUT" ;;
          esac

  review:
    needs: access
    if: needs.access.outputs.write == 'true'
    # Job-level: a workflow-level group would let every PR comment cancel a running review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Claude gets only GITHUB_TOKEN, passed as github_token below. Without it, the action uses the Claude GitHub App
    # token, which can push code, and writes it into .git/config, where Claude can read it.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # gh pr checks reads check runs, commit statuses, and the workflow run behind each check.
      actions: read
      checks: read
      statuses: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      # Removes ANTHROPIC_API_KEY and other secrets from the environment of the commands Claude runs.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
      # Runs review agents in the foreground. In the background, Claude ends its turn to wait for them, and the
      # action stops at that turn's end, so nothing gets posted.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    steps:
      # Tells the person who commented "claude review" that the review started.
      - if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes --silent
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # actions/checkout refuses fork PR code under pull_request_target without allow-unsafe-pr-checkout. Nothing
      # from this copy runs: the next step moves it out of the working directory and strips its agent files.
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: pr-head
          fetch-depth: 1
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      # Claude loads CLAUDE.md and .claude/ from inside its working directory. Move the PR out of it and drop the PR's
      # agent instruction files, so the PR cannot supply instructions.
      - run: |
          mv pr-head "$RUNNER_TEMP/pr-head"
          find "$RUNNER_TEMP/pr-head" \
            \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md -o -name .claude -o -name .mcp.json \) \
            -prune -exec rm -rf {} +
      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB fails without bubblewrap, and the action installs it only when
      # allowed_non_write_users is set. Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
      # This step, the Claude step, and the post step continue on error, so a failed review does not mark the PR's
      # check red. The report step turns a failure into a warning, and the last step reacts to the comment with a
      # confused face.
      - continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: '{"permissions": {"additionalDirectories": ["${{ runner.temp }}/pr-head"]}}'
          prompt: >-
            /pxt-review https://github.com/${{ github.repository }}/pull/${{ env.PR_NUMBER }}
            --pr-head ${{ runner.temp }}/pr-head
            ${{ github.event_name == 'issue_comment' && '--requested' || '' }}
          # Naming Grep or Glob here restores both tools, which Claude Code leaves out on Linux by default. Claude has
          # no tool that posts: its final message holds the review, and the post step publishes it.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Read" "Grep" "Glob" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)"
      # The action hides Claude's transcript. Print Claude's final message and each tool call the allowlist refused.
      - if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ "$OUTCOME" != success ]; then echo "::warning::The Claude review step ended with outcome $OUTCOME."; fi
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then exit 0; fi
          jq -r '.[] | select(.type == "result") | .result // empty' "$EXECUTION_FILE"
          jq -c '.[] | select(.type == "result") | .permission_denials[]? | {tool_name, tool_input}' "$EXECUTION_FILE"
      # Posts the summary and the inline comments as one review.
      - id: post
        if: steps.claude.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 .github/scripts/post_claude_review.py
      - if: >-
          always() && github.event_name == 'issue_comment' &&
          (steps.claude.outcome != 'success' || steps.post.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused --silent
