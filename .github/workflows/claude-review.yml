name: Claude review

# Reviews a PR when someone with write access comments "claude review", "agent review", or "agents review" on it,
# alone or followed by a focus, as in "claude review focus on function signatures" or "claude review: error paths". Runs started by issue_comment attach to the default branch, not to the PR, so the review adds no check to
# the PR. They use this file from the default branch with the repository's secrets, so fork PRs get reviewed too.
# Nothing from the PR runs. The review job receives only GITHUB_TOKEN, which cannot push.
#
# When a scheduled tests, stress-tests, or nightly run on the default branch fails, a separate ci-fix job
# investigates with Opus and may open a fix PR from a branch the plan computes. That job omits github_token so the
# Claude GitHub App can push; a GITHUB_TOKEN PR would not start checks. The review job still cannot push, and nothing
# addresses its findings: a person does. The erosion job, currently
# commented out, checks the complexity of every commit of a PR.
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [tests, stress-tests, nightly]
    types: [completed]

jobs:
  # Checks the request, the PR's state, the commenter's access, and whether a review of the PR already runs, and
  # extracts the focus.
  plan:
    # startsWith() ignores case; plan_claude_review.py tells a request from a remark that starts the same way.
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, 'claude review') ||
      startsWith(github.event.comment.body, 'agent review') || startsWith(github.event.comment.body, 'agents review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # plan_claude_review.py lists this workflow's runs and their jobs to find a running review.
      actions: read
    outputs:
      pr: ${{ steps.plan.outputs.pr }}
      focus: ${{ steps.plan.outputs.focus }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: python3 .github/scripts/plan_claude_review.py

  # A scheduled tests, stress-tests, or nightly run on the default branch that failed. plan_claude_ci_fix.py
  # ignores pull_request runs, successful runs, stale runs, a run a person already took over or closed, and a workflow
  # that already has an open CI-fix PR.
  plan-ci-fix:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      workflow: ${{ steps.plan.outputs.workflow }}
      branch: ${{ steps.plan.outputs.branch }}
      context: ${{ steps.plan.outputs.context }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/plan_claude_ci_fix.py

  # Isolated from review: this job can push. It omits github_token so the action uses the Claude GitHub App,
  # whose PRs start checks. GITHUB_TOKEN cannot. The review job below still receives only GITHUB_TOKEN.
  ci-fix:
    name: 'ci-fix ${{ needs.plan-ci-fix.outputs.workflow }}'
    needs: plan-ci-fix
    if: needs.plan-ci-fix.outputs.context
    concurrency:
      group: claude-ci-fix-${{ needs.plan-ci-fix.outputs.workflow }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      # The Claude GitHub App exchanges the OIDC token for a short-lived installation token that can push.
      id-token: write
    outputs:
      pr: ${{ steps.result.outputs.pr }}
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - env:
          CONTEXT: ${{ needs.plan-ci-fix.outputs.context }}
        run: printf '%s\n' "$CONTEXT" > ci-fix-context.json
      - continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # No continue-on-error here or on the result step: a CI-fix that could not run fails the job.
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # A scheduled run's actor is the account that last changed the workflow's cron line or re-enabled it. For
          # stress-tests that is github-merge-queue[bot], and the action refuses a bot it was not told to allow.
          # Naming a bot here turns off the action's default auto permission mode, so claude_args sets it.
          allowed_bots: github-merge-queue
          additional_permissions: |
            actions: read
          prompt: /pxt-ci-fix ci-fix-context.json
          claude_args: >-
            --model claude-opus-5-5 --permission-mode auto
            --allowedTools "Read" "Grep" "Glob" "Edit" "Write" "Bash(git:*)" "Bash(gh:*)"
            "Bash(python:*)" "Bash(python3:*)" "Bash(pytest:*)" "Bash(make:*)" "Bash(ruff:*)"
            "Bash(mypy:*)" "Bash(uv:*)"
      - if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ "$OUTCOME" != success ]; then echo "::warning::The Claude CI-fix step ended with outcome $OUTCOME."; fi
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then exit 0; fi
          jq -r '.[] | select(.type == "result") | .result // empty' "$EXECUTION_FILE"
          jq -c '.[] | select(.type == "result") | .permission_denials[]? | {tool_name, tool_input}' "$EXECUTION_FILE"
          jq -r '.[] | select(.type == "result") | (.modelUsage // {}) | to_entries[] | [.key,
            "$\((.value.costUSD * 100 | round) / 100)", "input \(.value.inputTokens)", "output \(.value.outputTokens)",
            "cache read \(.value.cacheReadInputTokens)", "cache write \(.value.cacheCreationInputTokens)"]
            | join(", ")' "$EXECUTION_FILE"
      - id: result
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          BRANCH: ${{ needs.plan-ci-fix.outputs.branch }}
        run: python3 .github/scripts/parse_claude_ci_fix.py

  review:
    # plan_claude_review.py finds a running review by this name.
    name: 'review #${{ needs.plan.outputs.pr || needs.ci-fix.outputs.pr }}'
    needs: [plan, ci-fix]
    # always() so a skipped plan (workflow_run) or skipped ci-fix (issue_comment) does not skip this job.
    if: >-
      always() && !cancelled() &&
      ((needs.plan.result == 'success' && needs.plan.outputs.pr) ||
       (needs.ci-fix.result == 'success' && needs.ci-fix.outputs.pr))
    # Two requests that pass the plan's check at the same moment run one after the other.
    concurrency:
      group: claude-review-${{ needs.plan.outputs.pr || needs.ci-fix.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Claude gets only GITHUB_TOKEN, passed as github_token below. Without it, the action uses the Claude GitHub App
    # token, which can push code, and writes it into .git/config, where Claude can read it. CI-fix PRs are reviewed
    # here with the same token; they do not inherit ci-fix's push permission.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # gh pr checks reads check runs, commit statuses, and the workflow run behind each check.
      actions: read
      checks: read
      statuses: read
    env:
      PR_NUMBER: ${{ needs.plan.outputs.pr || needs.ci-fix.outputs.pr }}
      # Removes ANTHROPIC_API_KEY and other secrets from the environment of the commands Claude runs.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
      # Runs review agents in the foreground. In the background, Claude ends its turn to wait for them, and the
      # action stops at that turn's end, so nothing gets posted.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    steps:
      # Tells the requester that the review started. Grok and Muse already use eyes, rocket, and heart.
      - if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=+1 --silent
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # actions/checkout refuses fork PR code in this run without allow-unsafe-pr-checkout. Nothing from this copy runs:
      # the next step moves it out of the working directory and strips its agent files.
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: pr-head
          fetch-depth: 1
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      # Claude loads CLAUDE.md and .claude/ from inside its working directory. Move the PR out of it and drop the PR's
      # agent instruction files, so the PR cannot supply instructions.
      - run: |
          mv pr-head "$RUNNER_TEMP/pr-head"
          find "$RUNNER_TEMP/pr-head" \
            \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md -o -name .claude -o -name .mcp.json \) \
            -prune -exec rm -rf {} +
      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB fails without bubblewrap, and the action installs it only when
      # allowed_non_write_users is set. Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
      # This step, the Claude step, the post step, and both reaction steps continue on error, so a failed review does
      # not fail the run. The report step turns a failure into a warning, and the last step reacts to the comment with
      # a confused face.
      - continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # A review of a CI-fix PR inherits the scheduled run's actor, which can be github-merge-queue[bot]. A comment
          # request never needs this: the plan job already refused a commenter without write access. Naming a bot
          # turns off the action's default auto permission mode, so claude_args sets it.
          allowed_bots: ${{ github.event_name == 'workflow_run' && 'github-merge-queue' || '' }}
          settings: '{"permissions": {"additionalDirectories": ["${{ runner.temp }}/pr-head"]}}'
          prompt: >-
            /pxt-review https://github.com/${{ github.repository }}/pull/${{ env.PR_NUMBER }}
            --pr-head ${{ runner.temp }}/pr-head
            ${{ needs.plan.outputs.focus && format('--focus {0}', needs.plan.outputs.focus) || '' }}
          # Opus runs the review and hands each pass to a subagent, as the command says. Naming Grep or Glob restores
          # both tools, which Claude Code leaves out on Linux by default. Claude has no tool that posts: its final
          # message holds the review, and the post step publishes it.
          claude_args: >-
            --model claude-opus-5-5 --permission-mode auto
            --allowedTools "Read" "Grep" "Glob" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)"
      # The action hides Claude's transcript. Print Claude's final message, each tool call the allowlist refused, and
      # the cost per model.
      - if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ "$OUTCOME" != success ]; then echo "::warning::The Claude review step ended with outcome $OUTCOME."; fi
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then exit 0; fi
          jq -r '.[] | select(.type == "result") | .result // empty' "$EXECUTION_FILE"
          jq -c '.[] | select(.type == "result") | .permission_denials[]? | {tool_name, tool_input}' "$EXECUTION_FILE"
          jq -r '.[] | select(.type == "result") | (.modelUsage // {}) | to_entries[] | [.key,
            "$\((.value.costUSD * 100 | round) / 100)", "input \(.value.inputTokens)", "output \(.value.outputTokens)",
            "cache read \(.value.cacheReadInputTokens)", "cache write \(.value.cacheCreationInputTokens)"]
            | join(", ")' "$EXECUTION_FILE"
      # Posts the summary and the inline comments as one review.
      - id: post
        if: steps.claude.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 .github/scripts/post_claude_review.py
      # A cancelled run is no failure of the review.
      - if: >-
          always() && !cancelled() && github.event_name == 'issue_comment' &&
          (steps.claude.outcome != 'success' || steps.post.outcome != 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused --silent

  # When enabled, runs on every commit of a PR, next to plan and review. Measures how the PR changes code erosion and
  # verbosity, as SlopCodeBench (arXiv 2603.24755) defines them, and has Claude judge up to 10 functions above
  # complexity 10 that grew. Posts one comment once the PR leaves the bounds, then updates it on each commit. The
  # script only parses the PR's files; nothing from the PR runs.
  # Paused for now: the job stays commented rather than deleted so it can be restored quickly. Restoring it also needs
